name: SonarQube Cloud Scan
on:
  push:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
jobs:
  sonarcloud:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os: [ubuntu-24.04]
        php: ["8.6"]
    env:
      tools: composer
      ini-values: default_charset='UTF-8'
    name: PHP ${{ matrix.php }} test on ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: ${{ env.ini-values }}
          coverage: pcov
          tools: ${{ env.tools }}
        env:
          fail-fast: true
      - name: Setup problem matchers for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
      - name: Validate composer
        run: composer validate
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-progress
      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit --coverage-clover=build/logs/clover.xml
          --log-junit=build/logs/junit.xml
      - name: Fix paths for sonar-scanner
        working-directory: ./build/logs
        run: |
          sed -i 's@'$GITHUB_WORKSPACE'@/github/workspace@g' clover.xml
          sed -i 's@'$GITHUB_WORKSPACE'@/github/workspace@g' junit.xml
      - name: SonarQube cloud auth
        uses: SonarSource/sonarqube-auth-action@v1
      - name: SonarQube cloud scan
        uses: SonarSource/sonarqube-scan-action@v8
